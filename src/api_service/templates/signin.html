<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signin: Academic Atlas</title>
    <link rel="icon" href="https://raw.githubusercontent.com/upskillr-ai/marketplace/0b33dc463400620e861ad1023edc25a6097ca9fb/Images/harvard_atlas.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #004AAD; /* Upskillr.ai primary color */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .upskillr-logo {
            width: 150px; /* Logo width */
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .form-label {
            text-align: left; /* Align label text to the left */
            display: block; /* Ensure the label takes the full width for alignment */
            margin-bottom: 5px; /* Adjust space between label and input field */
        }

        .form-control, .btn {
            border-radius: 5px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            width: 100%;
            margin-top: 10px;
        }

        a, .signup-link p {
            color: var(--primary-color);
        }

        .signup-link {
            margin-top: 15px;
        }
        .upskillr-logo {
            height: 50px; /* Adjust the logo size */
            width: auto;
            margin-right: 10px; /* Space between logo and text */
            transition: transform 0.3s ease; /* Smooth zoom transition */
        }

        .upskillr-logo:hover {
            transform: scale(1.1); /* Zoom effect on hover */
        }
        .form-text {
            color: #6c757d; /* Muted text color for instructions or notes */
            font-size: 0.875em; /* Slightly smaller font size for the text */
            margin-top: 0.25rem; /* Space above the text for separation */
        }        
    </style>
</head>
<body>

    <div class="container">
        <img src="{{ url_for('static', filename='images/admin_logo.png') }}" alt="Upskillr Logo" class="upskillr-logo" style="max-height: 50px;">
        <h1>Welcome Back!</h1>
        <form action="/signin" method="post">
            <div class="mb-3 text-left">
                <label for="username" class="form-label">Email ID</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3 text-left">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3 text-left">
                <label for="login_code" class="form-label">Login Code</label>
                <small class="form-text text-muted">Required only for your first login. Check your signup email.</small>
                <input type="text" class="form-control" id="login_code" name="login_code">
            </div>            
            <button type="submit" class="btn btn-primary">Sign In</button>
            <div class="signup-link">
                <p>Don't have an account? <a href="/signup">Sign Up</a></p>
            </div>
            <div class="signup-link">
                <p>Powered by MasalaChai ❤</p>
            </div>
        </form>
    </div>

</body>
</html>
