<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ persona.title }} - Academic Atlas</title>
    <link rel="icon" href="https://raw.githubusercontent.com/upskillr-ai/marketplace/0b33dc463400620e861ad1023edc25a6097ca9fb/Images/harvard_atlas.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <!-- Prism.js Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Prism.js Core and Language Syntax -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>

    <style>

        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            overflow-x: hidden;
        }
        
        header, footer {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        
        header {
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        footer {
            bottom: 0;
            padding: 10px;
        }
        
        #chatbox {
            margin-top: 80px; /* Adjust based on header height */
            margin-bottom: 80px; /* Adjust based on footer height */
            padding: 15px;
            overflow-y: auto;
            position: relative;
            height: calc(100% - 160px); /* Adjust based on header and footer height */
        }
        
        .input-group {
            position: fixed;
            bottom: 0;
            width: calc(100% - 30px); /* Adjust based on padding */
            padding: 10px 15px;
            box-shadow: 0 -2px 4px rgba(0,0,0,.1);
            background-color: #fff;
            display: flex;
        }
        
        #userInput {
            flex-grow: 1;
            margin-right: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            padding: 8px;
            resize: none; /* Disable manual resizing */
	    max-height: 200px; /* Add a max-height for the input box */
            overflow-y: auto; /* Add scroll if content exceeds max-height */
        }
        
        #sendButton {
            padding: 8px 20px;
            border-radius: 4px;
            background-color: #004AAD;
            color: white;
            border: 1px solid #007bff;
        }
        
        #sendButton:hover {
            background-color: darken(#007bff, 10%);
            border-color: darken(#007bff, 10%);
        }
        
        #loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #007bff;
        }
        
        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            background-color: #f9f9f9;
            border: 1px solid #e1e1e1;
            max-width: 80%;
        }
        
        .bot-message {
            background-color: #fff;
            margin-left: 0;
        }
        
        .user-message {
            background-color: #d1e7dd;
            margin-right: 20px;
            align-self: flex-end;
        }
        
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            #userInput {
                margin-bottom: 10px;
            }
            #sendButton {
                width: 100%;
            }
        }
        
        .btn-outline-primary {
            color: #004AAD;
            border-color: #004AAD;
        }
        
        .arrow-buttons-container {
            position: fixed;
            right: 20px; /* Adjust as per your layout */
            bottom: 100px; /* Adjust based on the footer height */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .scroll-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 5px;
            font-size: 20px;
            line-height: 40px;
            text-align: center;
            vertical-align: middle;
            background-color: #007bff;
            color: white;
            border: none;
        }
        
        .scroll-btn:hover {
            background-color: darken(#007bff, 10%);
        }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

        <!-- Fixed header -->
        <header class="bg-white shadow px-4 py-2 d-flex justify-content-between align-items-center">
            <!-- Upskillr Logo now at the extreme left -->
            <img src="{{ url_for('static', filename='images/admin_logo.png') }}" alt="Upskillr Logo" class="upskillr-logo" style="max-height: 50px;">

            <!-- Centered Persona title + image -->
            <div class="d-flex align-items-center mx-auto">
                <img src="{{ persona.image_url }}" alt="{{ persona.title }}" class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover;">
                <h1 class="h2 mb-0 ms-3">{{ persona.title }}</h1>
            </div>

            <div>
                <!-- Persona Dashboard Button -->
                <a href="{{ url_for('persona_dashboard') }}" class="btn btn-outline-primary me-2">Dashboard</a>
                <!-- Email Chat Button -->
                <button class="btn btn-outline-primary" id="emailChat">Email Chat</button>
            </div>
        </header>


        <div class="container-fluid d-flex h-100">
            <div class="row flex-grow-1">
                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 d-flex flex-column main-content">
                    <div id="chatbox">
                        <!-- Chat messages will be added here -->
                    </div>
                    <!-- Loader -->
                    <div id="loader">
                        <div class="spinner-border text-secondary" role="status">
                            <span class="sr-only"></span>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <!-- Fixed footer -->

        <footer>
            <div class="input-group">
                <textarea id="userInput" class="form-control" placeholder="Type your message..."></textarea>
                <button class="btn btn-primary" type="button" id="sendButton">Send</button>
            </div>
        </footer>


    <!-- Loading Modal -->
    <div class="modal" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Kindly wait for a couple of minutes. We are emailing you the conversation.</p>
                </div>
            </div>
        </div>
    </div>


        
    <script>
        let initialSystemMessageSent = false;  // Flag to track if the initial system message has been sent
        let conversationHistory = [];

        // Function to show error modal
        function showErrorModal(errorMessage) {
            $("#errorModalMessage").text(errorMessage);
            $("#errorModal").modal('show');
        }      

        document.getElementById('emailChat').addEventListener('click', function() {
            console.log("Email Chat button clicked");

            // Show the loading modal
            $('#loadingModal').modal({
                backdrop: 'static', // Disable clicking outside to close
                keyboard: false // Disable keyboard to close
            }).modal('show');

            fetch('/api/email_chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ personaName: "{{persona.title}}", personaDescription: "{{persona.description}}", conversation: conversationHistory })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    $('#loadingModal').modal('hide');
                    alert("Chat emailed successfully! Kindly check your inbox after 2 minutes.");
                } else {
                    $('#loadingModal').modal('hide');
                    alert("Failed to email chat: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                $('#loadingModal').modal('hide');
                alert("An error occurred while emailing the chat.");
            });
        });   
    
        document.addEventListener("DOMContentLoaded", function() {
    
            let personaId = "{{ persona.id }}";
            initiateConversation(personaId);
    
            document.getElementById('sendButton').addEventListener('click', function() {
                let userInputField = document.getElementById('userInput');
                let userInput = userInputField.value;
                handleUserInput(personaId, userInput);
                // Clear the input field after sending the message
                userInputField.value = '';
		userInputField.style.height = 'auto';
            });
    
            document.getElementById('userInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault(); // Prevent new line
                    document.getElementById('sendButton').click(); // Trigger send button click event
                }
            });
            document.getElementById('userInput').addEventListener('input', function() {
            	this.style.height = 'auto'; // Reset height first to calculate scrollHeight correctly
            	this.style.height = (this.scrollHeight) + 'px';
            });	
        });
    
        let fullMessage = ''; // Variable to hold the accumulated message
        let messageDiv = null; // Variable to hold the message div
    
        function initiateConversation(personaId) {
            handleUserInput(personaId, "Hello");
        }
        
        $(document).ready(function() {
            // Open the key modal
            $("#openKeyModalButton").click(function() {
                fetch('/get_user_key')
                .then(response => response.json())
                .then(data => {
                    if (data.key) {
                        $("#openaiApiKey").val(data.key); // Set the key in the modal input
                    }
                    $("#openaiKeyModal").modal('show');
                });
            });
        });

        // This function is called to append user messages to the chatbox
        function appendUserMessage(message) {
            let chatbox = document.getElementById('chatbox');
            let messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.innerHTML = `<p>${marked.marked(message)}</p>`;
            chatbox.appendChild(messageDiv);
        }

        // Declare a variable outside of the function to hold the complete message
        let completeBotMessage = '';

        // Append Bot Message Function
        function appendBotMessage(messagePart) {
            fullMessage += messagePart; // Accumulate the message parts

            if (!messageDiv) {
                messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                document.getElementById('chatbox').appendChild(messageDiv);
            }

            // Convert fullMessage markdown to HTML
            messageDiv.innerHTML = marked.marked(fullMessage, {
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    return hljs.highlight(code, { language: lang }).value;
                }
            });
        }

        function streamMessage(message) {
            let i = 0;
            const speed = 0; // Time delay between characters (in ms)
            fullMessage = ''; // Reset the full message
        
            if (!messageDiv) {
                messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                document.getElementById('chatbox').appendChild(messageDiv);
            }
        
            function typeWriter() {
                if (i < message.length) {
                    fullMessage += message.charAt(i);
                    messageDiv.innerHTML = marked.marked(fullMessage, {
                        breaks: true,
                        gfm: true,
                        highlight: function(code, lang) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                    });
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            typeWriter();
        }
        
        
        // Stream Messages Function
        async function streamMessages(personaId, userInput) {
            document.getElementById('loader').style.display = 'block';

            // Update conversation history
            if (userInput) {
                conversationHistory.push({ role: "user", content: userInput });
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ persona_id: personaId, conversation: conversationHistory })
                });
        
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
        
                const data = await response.json(); // Assuming the response is JSON
                console.log(data);
        
                if (data.message) {
                    conversationHistory.push({ role: "system", content: data.message });
                    streamMessage(data.message);
                } else {
                    console.error('No message in the response');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorModal(error.message);
            }
        
            document.getElementById('loader').style.display = 'none';
        }

        // This async function handles the input from the user, sends it to the server, and processes the response
        async function handleUserInput(personaId, userInput) {
            // Check if the user has an API key set
            const keyResponse = await fetch('/check_api_key');
            const keyResult = await keyResponse.json();
            if (!keyResult.has_key) {
                // Show the API key modal if the user doesn't have an API key
                $("#openaiKeyModal").modal('show');
                return;
            }

            const initialMessage = userInput === "Hello";

            // Append user message to chatbox
            if (!initialMessage && userInput.trim()) {
                appendUserMessage(userInput.trim()); // Make sure to trim for any extra whitespace
            }
        
            // Clear existing messages
            fullMessage = '';
            messageDiv = null;
        
            // Call streamMessages for real-time updates
            await streamMessages(personaId, userInput);
        
            // Clear the user input field only if userInput is not null
            if (userInput !== null) {
                document.getElementById('userInput').value = '';
            }
            // Reset the height of the input field after sending the message
            document.getElementById('userInput').style.height = 'auto';
        }

        // This function renders the streamed message as Markdown
        function renderMarkdown(fullMessage) {
            if (!messageDiv) {
                messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                document.getElementById('chatbox').appendChild(messageDiv);
            }

            // Convert fullMessage markdown to HTML
            messageDiv.innerHTML = marked.marked(fullMessage, {
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    return hljs.highlight(code, { language: lang }).value;
                }
            });

            // Scroll to the bottom of the chatbox
            let chatbox = document.getElementById('chatbox');
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
     
        
    </script>

    <!-- OpenAI API Key Modal -->
    <div class="modal fade" id="openaiKeyModal" tabindex="-1" aria-labelledby="openaiKeyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="openaiKeyModalLabel">OpenAI API Key</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" id="openaiApiKey" placeholder="Enter your OpenAI API key">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveOpenaiKey">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal HTML -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="errorModalMessage"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
