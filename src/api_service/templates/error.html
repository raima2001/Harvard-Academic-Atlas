<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - Academic Atlas</title>
    <link rel="icon" href="https://raw.githubusercontent.com/upskillr-ai/marketplace/0b33dc463400620e861ad1023edc25a6097ca9fb/Images/harvard_atlas.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #004AAD;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .error-message {
            color: blue;
            margin: 20px 0;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            width: 100%;
            margin-top: 10px;
        }

        a {
            color: var(--primary-color);
        }
        .signup-link {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Error Occurred</h1>
        <p class="error-message">{{ error_message }}</p>
        <a href="{{ return_url }}" class="btn btn-primary">Return</a>
        <div class="signup-link">
            <p>Powered by <a href="mailto:harvardacademicatlas@gmail.com">MasalaChai</a> ❤</p>
        </div>
    </div>
</body>
</html>
