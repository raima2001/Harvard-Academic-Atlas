<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup: Academic Atlas</title>
    <link rel="icon" href="https://raw.githubusercontent.com/upskillr-ai/marketplace/0b33dc463400620e861ad1023edc25a6097ca9fb/Images/harvard_atlas.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/js/all.min.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --upskillr-blue: #004AAD;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--upskillr-blue);
            margin-bottom: 20px;
            font-size: 1.5rem; /* Reduced font size */
        }

        .form-group {
            text-align: left;
        }

        .form-control, .btn {
            border-radius: 5px;
        }

        .btn-primary {
            background-color: var(--upskillr-blue);
            border-color: var(--upskillr-blue);
            width: 100%;
            margin-top: 15px;
        }

        .sign-in-link {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: var(--upskillr-blue);
        }

        .upskillr-logo {
            width: 150px;
            height: auto;
            margin-bottom: 15px;
        }

        .upskillr-logo:hover {
            transform: scale(1.1);
        }

        .password-requirements {
            text-align: left;
            font-size: 0.9rem; /* Slightly smaller font size for requirements */
            list-style-type: none; /* Remove default bullet points */
            padding-left: 0; /* Align with other elements */
            margin-top: 5px; /* Small space above list */
        }

        .password-requirements li:before {
            content: "•"; /* Custom bullet point */
            color: var(--upskillr-blue); /* Bullet point color */
            display: inline-block; 
            width: 1em; /* Space before bullet points */
            margin-left: -1em; /* Align bullet points */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="{{ url_for('static', filename='images/admin_logo.png') }}" alt="Upskillr Logo" class="upskillr-logo" style="max-height: 50px;">
        <h1>Create Your Account</h1>
        <form id="signupForm" action="/signup" method="post">    
            <div class="form-group mb-3">
                <label for="username" class="form-label">Email ID</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <span class="input-group-text"><i class="fas fa-eye" onclick="togglePasswordVisibility('password')"></i></span>
                </div>
                <ul class="password-requirements">
                    <li>At least 8 characters</li>
                    <li>Contains a special character</li>
                    <li>Includes a number</li>
                </ul>
            </div>
            <div class="form-group mb-3">
                <label for="confirmPassword" class="form-label">Retype Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    <span class="input-group-text"><i class="fas fa-eye" onclick="togglePasswordVisibility('confirmPassword')"></i></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Signup</button>
            <div class="sign-in-link">
                <p>Already have an account? <a href="/signin">Sign in</a></p>
            </div>
            <div class="sign-in-link">
                <p>Powered by MasalaChai ❤</p>
            </div>
        </form>
    </div>
    <script>
        function togglePasswordVisibility(passwordFieldId) {
            var passwordInput = document.getElementById(passwordFieldId);
            var passwordIcon = passwordInput.nextElementSibling.firstElementChild;
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = "password";
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }
    
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var username = document.getElementById('username').value;
    
            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                event.preventDefault();
                return false;
            }
    
            if (!username.includes('@')) {
                alert('Username must contain "@" symbol.');
                event.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
