<!-- footer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .custom-footer {
            background-color: #f4f4f4; /* White background */
            padding: 20px 0; /* Padding for top and bottom */
        }

        .custom-footer p {
            margin: 0; /* Remove default margin */
            color: #004AAD; /* Dark blue text */
            font-size: 16px; /* Adjust the font size as needed */
        }

        .footer-link {
            color: #004AAD; /* Dark blue text for the link */
            text-decoration: none; /* No underline */
        }

        .footer-link:hover {
            text-decoration: underline; /* Underline on hover for better user experience */
        }

        .heart-icon {
            color: #004AAD; /* Dark blue heart icon */
        }
    </style>
</head>
<body>
    <footer class="custom-footer">
        <div class="container text-center">
            <p>Powered by 
                <a href="mailto:harvardacademicatlas@gmail.com" class="footer-link">MasalaChai</a>
                <span class="heart-icon">&#10084;</span>
            </p>
        </div>
    </footer>
</body>
</html>
