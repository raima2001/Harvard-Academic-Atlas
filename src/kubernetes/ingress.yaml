apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: frontend.ac-215-hw2.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: api.ac-215-hw2.live.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 5000
  - host: vectorizer.ac-215-hw2.live.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vectorizer
            port:
              number: 8080
  tls:
  - secretName: 
    hosts:
    - frontend.ac-215-hw2.example.com
    - api.ac-215-hw2.example.com
    - vectorizer.ac-215-hw2.example.com
